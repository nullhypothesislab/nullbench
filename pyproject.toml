[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nullbench"
version = "0.1.0"
description = "Small, honest backtesting: point-in-time universes, realistic costs, null-hypothesis controls."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Null Hypothesis Lab", email = "nullhyplab@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[tool.setuptools]
packages = ["nullbench"]
